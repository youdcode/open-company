<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Office</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2316181d'/><rect x='8' y='8' width='7' height='7' rx='2' fill='%23fff'/><rect x='17' y='8' width='7' height='7' rx='2' fill='%23fff' opacity='.55'/><rect x='8' y='17' width='7' height='7' rx='2' fill='%23fff' opacity='.55'/><rect x='17' y='17' width='7' height='7' rx='2' fill='%234ade80'/></svg>">
<style>
:root{
  --bg:#f6f6f3;--panel:#fff;--ink:#15171b;--ink-2:#3b3f47;--muted:#737883;--line:#e6e4de;--soft:#efeee9;
  --accent:#1f5eff;--accent-soft:#e8eeff;--ok:#15803d;--ok-soft:#e3f4e8;--warn:#b45309;--warn-soft:#fdf0dc;
  --hot:#c2410c;--hot-soft:#fde8dc;--cold:#64748b;--cold-soft:#eef1f5;--shadow:0 1px 2px rgba(20,20,20,.04),0 4px 16px rgba(20,20,20,.04);
  --r:12px;--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d0e11;--panel:#15171b;--ink:#e9ebef;--ink-2:#c3c7cf;--muted:#8b919c;--line:#262930;--soft:#1c1f24;
  --accent:#6b93ff;--accent-soft:#1b2440;--ok:#4ade80;--ok-soft:#14291c;--warn:#fbbf24;--warn-soft:#2d2412;
  --hot:#fb923c;--hot-soft:#2e1d12;--cold:#94a3b8;--cold-soft:#1d2229;--shadow:none}}
:root[data-theme=dark]{--bg:#0d0e11;--panel:#15171b;--ink:#e9ebef;--ink-2:#c3c7cf;--muted:#8b919c;--line:#262930;--soft:#1c1f24;
  --accent:#6b93ff;--accent-soft:#1b2440;--ok:#4ade80;--ok-soft:#14291c;--warn:#fbbf24;--warn-soft:#2d2412;
  --hot:#fb923c;--hot-soft:#2e1d12;--cold:#94a3b8;--cold-soft:#1d2229;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px}
.mark i{border-radius:2px;background:var(--bg)}.mark i:nth-child(2),.mark i:nth-child(3){opacity:.55}.mark i:nth-child(4){background:#4ade80}
.brand b{font-size:15px;letter-spacing:-.01em}.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
nav a:hover{background:var(--soft);text-decoration:none}nav a.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);outline:1px solid var(--line)}
nav .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.engine{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:12px;color:var(--muted)}
.engine b{color:var(--ink);display:block;font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.live.on .dot{background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
main{padding:24px 32px 64px;min-width:0}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{font-size:22px;letter-spacing:-.02em;margin:0}h2{font-size:15px;margin:0 0 12px;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:2px}
.banner{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);margin-bottom:20px;border:1px solid transparent}
.banner code{background:var(--panel);padding:2px 8px;border-radius:6px;font-family:var(--mono);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi span{color:var(--muted);font-size:12px}.kpi b{display:block;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.org{display:flex;flex-direction:column;align-items:center;gap:0}
.org .lead-row{display:flex;justify-content:center;width:100%}
.org .stem{width:1px;height:18px;background:var(--line)}
.org .rail{height:1px;background:var(--line);width:calc(100% - 180px)}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;margin-top:18px}
.role{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:border-color .3s,transform .3s;min-width:0}
.role.work{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.role .who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:650;font-size:12px;color:#fff;background:var(--c);flex:none;letter-spacing:.02em}
.role .t{font-weight:600;line-height:1.25;overflow-wrap:anywhere}.role .d{color:var(--muted);font-size:12px}
.role .last{font-size:12px;color:var(--ink-2);min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.work{background:var(--ok-soft);color:var(--ok)}.pill.work::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.pill.hot{background:var(--hot-soft);color:var(--hot)}.pill.warm{background:var(--warn-soft);color:var(--warn)}.pill.cold{background:var(--cold-soft);color:var(--cold)}
.pill.approved,.pill.won,.pill.meeting{background:var(--ok-soft);color:var(--ok)}.pill.draft,.pill.drafted{background:var(--accent-soft);color:var(--accent)}
.pill.rejected,.pill.lost,.pill.do_not_contact{background:var(--hot-soft);color:var(--hot)}
.feed{max-height:calc(100vh - 150px);overflow:auto}
.ev{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}.ev .av{width:26px;height:26px;border-radius:7px;font-size:10.5px}
.ev .m{min-width:0}.ev .h{font-size:12px;color:var(--muted)}.ev .h b{color:var(--ink);font-weight:600;margin-right:6px}
.ev .x{color:var(--ink-2);overflow-wrap:anywhere}.ev .f{font-family:var(--mono);font-size:11.5px;color:var(--muted);cursor:pointer}
.ev.new{animation:flash 1.6s ease-out}@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--soft)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--ink-2);white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:12px}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);padding:5px 12px;border-radius:999px;font-size:12.5px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.drafts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.draft{display:flex;flex-direction:column}
.draft .hd{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.draft .subj{font-weight:600;margin-top:6px}
.draft .body{padding:12px 16px;white-space:pre-wrap;color:var(--ink-2);font-size:13.5px;flex:1;max-height:260px;overflow:auto}
.draft .ft{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn:disabled{opacity:.5;cursor:default}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{background:var(--soft);border-radius:var(--r);padding:10px;min-height:160px}
.col h3{font-size:12.5px;margin:2px 4px 10px;display:flex;justify-content:space-between;color:var(--ink-2)}
.task{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow)}
.task .o{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}.task .o .av{width:18px;height:18px;border-radius:5px;font-size:9px}
.msg{padding:14px 16px;border-top:1px solid var(--line)}.msg:first-child{border-top:0}
.msg .route{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}.msg .route .av{width:22px;height:22px;border-radius:6px;font-size:9.5px}
.msg .s{font-weight:600;margin:6px 0 2px}
.files .fr{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.files .fr:first-child{border-top:0}.files .fr:hover{background:var(--soft)}.files .p{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}.empty code{font-family:var(--mono);background:var(--soft);padding:2px 8px;border-radius:6px;color:var(--ink)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(640px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s ease;z-index:10;display:flex;flex-direction:column}
.drawer.open{transform:none}.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);gap:12px}
.drawer .dh span{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}.drawer .db{padding:8px 24px 40px;overflow:auto}
.md h1{font-size:20px;margin:18px 0 8px}.md h2{font-size:16px;margin:18px 0 6px}.md h3{font-size:14px;margin:14px 0 4px}
.md p,.md li{color:var(--ink-2)}.md code{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:1px 5px;border-radius:5px}
.md pre{background:var(--soft);padding:12px;border-radius:8px;overflow:auto}.md pre code{background:none;padding:0}
.md blockquote{margin:8px 0;padding:4px 14px;border-left:3px solid var(--line);color:var(--muted)}
.md table{margin:10px 0;font-size:13px}.md th,.md td{border:1px solid var(--line)}
.meta{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.meta dt{color:var(--muted)}.meta dd{margin:0;overflow-wrap:anywhere}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
.chat-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-bar select,.chat-bar input{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.chat-bar input{width:170px}
.chat-log{flex:1;overflow:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:14px}
.bub{max-width:78%;padding:10px 14px;border-radius:14px;line-height:1.5;overflow-wrap:anywhere}
.bub.you{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px;white-space:pre-wrap}
.bub.dir{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.bub.dir p{margin:.3em 0}.bub.dir ul,.bub.dir ol{margin:.3em 0;padding-left:1.2em}.bub.dir table{font-size:13px}
.bub.sys{align-self:center;background:none;color:var(--muted);font-size:12px;padding:2px}
.who-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}.who-line .av{width:20px;height:20px;border-radius:6px;font-size:9px}
.tool{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:2px 0}.tool::before{content:"› "}
.err{color:var(--hot);font-size:13px;margin-top:4px}
.thinking{color:var(--muted);font-size:13px}.thinking::after{content:"…";animation:blink 1.2s infinite}
.composer{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{flex:1;font:inherit;resize:none;min-height:44px;max-height:180px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:auto 0}.sugg button{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);padding:7px 12px;border-radius:999px;font-size:13px}
.lang{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--panel);align-self:flex-start}
.lang button{border:0;background:none;color:var(--muted);font-weight:600;font-size:12px;padding:4px 10px;border-radius:7px}
.lang button.on{background:var(--ink);color:var(--bg)}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.to{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0;align-items:center}.to .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.to button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);padding:4px 10px 4px 5px;border-radius:999px;font-size:12.5px}
.to button .av{width:18px;height:18px;border-radius:5px;font-size:8.5px}.to button.on{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.to button.auto{padding-left:10px}
.team{align-self:stretch;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:2px 4px;cursor:pointer;min-width:0}
.team .av{width:18px;height:18px;border-radius:5px;font-size:8.5px}.team b{color:var(--ink-2);font-weight:600;white-space:nowrap}.team .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av.x3{font-size:10px;letter-spacing:-.03em}.team .av.x3,.who-line .av.x3,.to button .av.x3,.task .o .av.x3,.msg .route .av.x3{font-size:6.5px}.ev .av.x3{font-size:8px}
.dirs{border-bottom:1px solid var(--line);padding:10px 14px;display:none;flex-direction:column;gap:8px;background:var(--soft)}
.dirs.open{display:flex}.dirs .row{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12.5px}
.dirs input{flex:1;font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0;align-items:center}.quick .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.quick button{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);padding:4px 10px;border-radius:999px;font-size:12.5px;font-family:var(--mono)}
.quick button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-family:var(--font);font-weight:600}
.say{align-self:flex-start;max-width:78%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px}
.say .who-line{margin-bottom:2px}.say .md p{margin:.2em 0}
.artcard{align-self:flex-start;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;max-width:78%}
.toast{position:fixed;right:20px;bottom:20px;z-index:30;display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.15);border-radius:12px;padding:12px 14px}
.btn.mic{padding:7px 10px}.btn.mic.rec{background:#dc2626;border-color:#dc2626;color:#fff;animation:blink 1.2s infinite}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.art{padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}.art:hover{border-color:var(--ink)}
.art .k{font-family:var(--mono);font-size:11px;color:var(--muted)}
#art-modal{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:20;display:none;padding:28px}#art-modal.open{display:flex}
#art-modal .box{flex:1;display:flex;flex-direction:column;background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#art-modal .bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}#art-modal iframe{flex:1;border:0;background:#fff}
.bub .to-line{font-size:11px;opacity:.7;margin-bottom:2px}
@media (max-width:1100px){.roles{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.grid2{grid-template-columns:1fr}.feed{max-height:none}.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  nav{flex-direction:row;overflow:auto}nav a{white-space:nowrap}.engine{display:none}main{padding:16px}.kpis{grid-template-columns:repeat(2,1fr)}
  .drafts{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="mark"><i></i><i></i><i></i><i></i></div><div><b id="co">Your company</b><small data-i18n="liveOffice">Live office</small></div></div>
    <nav id="nav">
      <a href="#office"><span data-i18n="v_office">Office</span> <span class="n" id="n-office"></span></a>
      <a href="#chat"><span data-i18n="v_chat">Chat</span> <span class="n" id="n-chat"></span></a>
      <a href="#artifacts"><span data-i18n="v_artifacts">Artifacts</span> <span class="n" id="n-artifacts"></span></a>
      <a href="#pipeline"><span data-i18n="v_pipeline">Pipeline</span> <span class="n" id="n-pipeline"></span></a>
      <a href="#outreach"><span data-i18n="v_outreach">Outreach</span> <span class="n" id="n-outreach"></span></a>
      <a href="#finance"><span data-i18n="v_finance">Finance</span> <span class="n" id="n-finance"></span></a>
      <a href="#board"><span data-i18n="v_board">Board</span> <span class="n" id="n-board"></span></a>
      <a href="#messages"><span data-i18n="v_messages">Handoffs</span> <span class="n" id="n-messages"></span></a>
      <a href="#files"><span data-i18n="v_files">Files</span> <span class="n" id="n-files"></span></a>
    </nav>
    <div class="side-bottom">
      <div class="lang" id="lang"><button data-lang="fr" onclick="setLang('fr')">FR</button><button data-lang="en" onclick="setLang('en')">EN</button></div>
      <div class="engine"><span class="live" id="live"><span class="dot"></span><span id="live-t">…</span></span><b id="engine"></b><span id="since"></span></div>
    </div>
  </aside>
  <main id="main"></main>

// ---------- minimal, safe markdown ----------
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(src) {
  src = String(src).replace(/^---\n[\s\S]*?\n---\n?/, '');
  const out = [], lines = src.split('\n');
  let i = 0;
  while (i < lines.length) {
    let l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue; }
    let h = /^(#{1,4})\s+(.*)/.exec(l); if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(l)) { const b = []; while (i < lines.length && /^>\s?/.test(lines[i])) b.push(lines[i++].replace(/^>\s?/, '')); out.push(`<blockquote>${inline(b.join(' '))}</blockquote>`); continue; }
    if (/^\s*\|/.test(l) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || '')) {
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<table><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table>`); continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, '').replace(/^\[( |x)\]\s*/, (m, x) => x === 'x' ? '✓ ' : '☐ '));
      out.push(`<${ordered ? 'ol' : 'ul'}>${items.map(x => `<li>${inline(x)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    const p = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\s*([-*]|\d+\.)\s|\s*\|)/.test(lines[i])) p.push(lines[i++]);
    if (!p.length) p.push(lines[i++]);
    out.push(`<p>${inline(p.join(' '))}</p>`);
  }
  return out.join('\n');
}
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { f += '"'; i++; } else if (c === '"') q = false; else f += c; continue; }
    if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; } else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function csvTable(text) {
  const rows = parseCSV(text.trim());
  if (!rows.length) return '';
  return `<table><tr>${rows[0].map(c => `<th>${esc(c)}</th>`).join('')}</tr>${rows.slice(1, 200).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
}

}
function chatPick(v) { if (v === '__other') { const f = $('#chat-model-free'); f.style.display = ''; f.focus(); return; } saveModel(v, chat.info.effort); }
function chatPickFree(v) { saveModel(String(v || '').trim(), chat.info.effort); }
function chatEffortPick(v) { saveModel(chat.info.pick, v); }

async function chatEngine(id) { await fetch('/api/chat/engine', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ engine: id }) }); chatInit(); }
async function chatNew() { if (chat.busy) return; await fetch('/api/chat/new', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }); chatInit(); }

// ---------- dictation (the browser's own speech recognition) ----------
let rec = null;
function micSetup() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const b = $('#chat-mic'); if (!b) return;
  if (!SR) { b.style.display = 'none'; return; }
  b.classList.toggle('rec', !!rec);
}
function stopDictation() { if (rec) { try { rec.stop(); } catch {} rec = null; micSetup(); } }
function dictate() {
  if (rec) return stopDictation();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  const ta = $('#chat-input'); const before = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
  rec = new SR(); rec.lang = LANG === 'fr' ? 'fr-FR' : 'en-US'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => { let txt = ''; for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript; ta.value = before + txt; ta.oninput?.(); };
  rec.onend = () => { rec = null; micSetup(); };
  rec.onerror = () => { rec = null; micSetup(); };
  rec.start(); micSetup();
}

// ---------- artifacts ----------
function artifacts() {
  const A = S.artifacts || [];
  return A.length ? `<div class="arts">${A.map(a => `<div class="card art" onclick="openArtifact(${arg(a.file)})"><div class="k">${esc(a.kind.toUpperCase())}</div><b>${esc(a.title)}</b>
    <div class="muted small">${esc(roleTitle(a.author))} · ${ago(a.created)}${a.description ? ' · ' + esc(a.description) : ''}</div></div>`).join('')}</div>`
    : `<div class="card empty">${t('noArtifacts')}</div>`;
}
function openArtifact(file) {
  const a = (S.artifacts || []).find(x => x.file === file) || { title: file, file, kind: file.split('.').pop() };
  const src = `/artifacts/${encodeURIComponent(file)}`;
  $('#art-title').textContent = a.title;
  $('#art-open').href = src; $('#art-dl').href = `${src}?download=1`;
  $('#art-frame').src = a.kind === 'md' ? 'about:blank' : src;
  if (a.kind === 'md') fetch(`/api/file?path=${encodeURIComponent('workspace/artifacts/' + file)}`).then(r => r.json()).then(f => { $('#art-frame').srcdoc = `<body style="font:15px/1.6 system-ui;max-width:760px;margin:30px auto;padding:0 20px">${md(f.content)}</body>`; });
  $('#art-modal').classList.add('open');
}
function closeArtifact() { $('#art-modal').classList.remove('open'); $('#art-frame').src = 'about:blank'; }

const money = (x, c) => { try { return new Intl.NumberFormat(LANG === 'fr' ? 'fr-FR' : undefined, { style: 'currency', currency: c || 'EUR' }).format(x); } catch { return `${x} ${c}`; } };
let armed = '';
function finance() {
  const D = S.finance || [];
  const sum = f => D.filter(f).reduce((s, d) => s + (d.totals?.gross || 0), 0);
  const cur = (D[0] && D[0].currency) || 'EUR';
  const k = [[t('k_toIssue'), D.filter(d => d.status === 'draft').length], [t('k_quotesOut'), money(sum(d => d.type === 'quote' && d.status === 'issued'), cur)],
    [t('k_unpaid'), money(sum(d => d.type === 'invoice' && d.status === 'issued'), cur)], [t('k_paid'), money(sum(d => d.status === 'paid'), cur)]];
  const actions = d => {
    if (d.status === 'draft') return armed === d.id
      ? `<button class="btn primary" onclick="finAct(${arg(d.id)},'issued',this)">${t('confirmIssue')}</button><button class="btn" onclick="armed='';render()">${t('cancel')}</button>`
      : `<button class="btn" onclick="armed=${arg(d.id)};render()">${t('issue')}</button>`;
    if (d.status === 'issued' && d.type === 'invoice') return `<button class="btn" onclick="finAct(${arg(d.id)},'paid',this)">${t('markPaid')}</button><button class="btn" onclick="finAct(${arg(d.id)},'void',this)">${t('voidIt')}</button>`;
    if (d.status === 'issued' && d.type === 'quote') return `<button class="btn" onclick="finAct(${arg(d.id)},'accepted',this)">${t('accepted')}</button><button class="btn" onclick="finAct(${arg(d.id)},'declined',this)">${t('declined')}</button>`;
    return '';
  };
  return `${S.billingReady ? '' : `<div class="banner">${t('billingBanner')}</div>`}
  <div class="kpis">${k.map(([a, b]) => `<div class="kpi"><span>${a}</span><b>${b}</b></div>`).join('')}</div>
  <div class="card" style="overflow:auto">${D.length ? `<table><tr><th>${t('c_document')}</th><th>${t('c_client')}</th><th class="num">${t('c_total')}</th><th>${t('c_status')}</th><th class="hide-sm">${t('c_dates')}</th><th></th></tr>
  ${D.map(d => `<tr><td><b>${d.type === 'quote' ? t('quote') : t('invoice')}</b><div class="muted small">${esc(d.number || t('draftNo'))}</div></td><td>${esc(d.client)}</td>
    <td class="num"><b>${esc(money(d.totals?.gross || 0, d.currency))}</b><div class="muted small">${esc(money(d.totals?.net || 0, d.currency))} ${t('exclVat')}</div></td>
    <td><span class="pill ${d.status === 'paid' || d.status === 'accepted' ? 'approved' : d.status === 'draft' ? 'draft' : d.status === 'void' || d.status === 'declined' ? 'rejected' : ''}">${esc(st(d.status))}</span></td>
    <td class="hide-sm small muted">${esc([d.issue_date && t('issuedOn', d.issue_date), d.due_date && t('dueOn', d.due_date)].filter(Boolean).join(' · ') || t('notIssued'))}</td>
    <td style="white-space:nowrap"><a class="btn" href="/finance/${encodeURIComponent(d.id)}.html" target="_blank" rel="noopener">${t('open')}</a> ${actions(d)}</td></tr>`).join('')}</table>`
  : `<div class="empty">${t('noDocs')}</div>`}</div>
  <p class="muted small">${t('financeFoot')}</p>`;
}
async function finAct(id, status, btn) {
  btn.disabled = true;
  const r = await fetch(`/api/finance/${id}/status`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status }) });
  armed = '';
  if (!r.ok) { const e = await r.json().catch(() => ({})); $('#main').insertAdjacentHTML('afterbegin', `<div class="banner">${esc(e.error || t('updateFailed'))}</div>`); btn.disabled = false; return; }
  load();
}
function board() {
  return `<div class="kanban">${['Todo', 'Doing', 'Review', 'Done'].map(c => `<div class="col"><h3>${t('col_' + c)}<span>${S.board[c].length}</span></h3>
    ${S.board[c].map(x => `<div class="task">${esc(x.text)}${x.role ? `<div class="o">${av(x.role)}${esc(roleTitle(x.role))}</div>` : ''}</div>`).join('') || `<div class="muted small" style="padding:4px">${t('empty')}</div>`}</div>`).join('')}</div>`;
}
function messages() {
  return `<div class="card">${S.messages.length ? S.messages.map(m => `<div class="msg"><div class="route">${av(m.from)}<b style="color:var(--ink)">${esc(roleTitle(m.from))}</b> → ${av(m.to)}<b style="color:var(--ink)">${esc(roleTitle(m.to))}</b><span style="margin-left:auto">${m.created ? ago(m.created) : ''}</span></div>
    <div class="s">${esc(m.subject)}</div><div class="x md">${md(m.body)}</div>${m.link ? `<div class="f ev" style="padding:0;border:0"><span class="f" onclick="openFile(${arg(m.link)})">${esc(m.link.replace(/^(workspace|\.demo)\//, ''))}</span></div>` : ''}</div>`).join('')
    : `<div class="empty">${t('noHandoffs')}</div>`}</div>`;
}
function files() {
  return `<div class="card files">${S.files.length ? S.files.map(f => `<div class="fr" onclick="openFile(${arg(f.path)})"><span class="p">${esc(f.path.replace(/^(workspace|\.demo)\//, ''))}</span><span class="muted small" style="white-space:nowrap">${f.author ? esc(roleTitle(f.author)) + ' · ' : ''}${ago(f.mtime)}</span></div>`).join('')
    : `<div class="empty">${t('noFiles')}</div>`}</div>`;
}

const VIEWS = { office, chat: chatView, artifacts, pipeline, outreach, finance, board, messages, files };

function render(fresh = []) {
  if (!S) return;
  const name = S.company.name && S.company.name !== 'Your company' ? S.company.name : (LANG === 'fr' ? 'Votre entreprise' : 'Your company');
  $('#co').textContent = name; document.title = `${name} · ${t('liveOffice')}`;
  const ENG = { claude: 'Claude Code', codex: 'Codex (ChatGPT)', opencode: 'OpenCode', agy: 'Antigravity (Gemini)', demo: LANG === 'fr' ? 'Démo (sans IA)' : 'Demo replay (no AI)' };
  $('#engine').textContent = S.session.engine ? t('runningOn', ENG[S.session.engine] || S.session.engine) : t('noAI');
  $('#since').textContent = S.session.started ? t('since', new Date(S.session.started).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })) : '';
  $('#n-pipeline').textContent = S.leads.length || ''; $('#n-outreach').textContent = S.drafts.filter(d => d.status === 'draft').length || '';
  $('#n-finance').textContent = (S.finance || []).filter(d => d.status === 'draft').length || '';
  $('#n-artifacts').textContent = (S.artifacts || []).length || '';
  $('#n-board').textContent = (S.board.Todo.length + S.board.Doing.length) || ''; $('#n-messages').textContent = S.messages.length || ''; $('#n-files').textContent = S.files.length || '';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + view));
  if (view === 'chat' && $('#chat-log')) { // keep the conversation on screen, add what the team says to each other
    if (!chat.info?.demo && chat.info?.history?.length !== undefined) S.events.forEach(e => { if (isTeam(e)) addTeam(e); });
    renderQuick();
    return;
  }
  const scroll = document.querySelector('.feed')?.scrollTop || 0;
  $('#main').innerHTML = `<header class="top"><div><h1>${t('v_' + view)}</h1><div class="sub">${t('s_' + view)}</div></div></header>${VIEWS[view](fresh.length > 0)}`;
  const feed = document.querySelector('.feed'); if (feed) feed.scrollTop = scroll;
  if (view === 'chat') chatInit();
}

// ---------- actions ----------
async function review(id, status, btn) {
  btn.disabled = true;
  const r = await fetch(`/api/drafts/${id}/status`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status }) });
  if (!r.ok) { btn.disabled = false; $('#main').insertAdjacentHTML('afterbegin', `<div class="banner">${t('updateFailed')}</div>`); return; }
  load();
}
async function openFile(p) {
  const r = await fetch(`/api/file?path=${encodeURIComponent(p)}`);
  if (!r.ok) return;
  const f = await r.json();
  $('#d-path').textContent = f.path.replace(/^(workspace|\.demo)\//, '');
  $('#d-body').innerHTML = f.path.endsWith('.csv') ? csvTable(f.content) : f.path.endsWith('.md') ? md(f.content) : `<pre><code>${esc(f.content)}</code></pre>`;
  $('#drawer').classList.add('open');
}
async function openLead(id) {
  const l = S.leads.find(x => x.id === id); if (!l) return;
  const links = v => (String(v || '').match(/https?:\/\/\S+/g) || []).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('<br>');
  const fields = [[t('l_website'), l.website && `<a href="${esc(/^https?:/.test(l.website) ? l.website : 'https://' + l.website)}" target="_blank" rel="noopener">${esc(l.website)}</a>`], [t('l_registry'), esc(l.registry_id)],
    [t('l_place'), esc([l.city, l.country].filter(Boolean).join(', '))], [t('l_industry'), esc(l.industry)], [t('l_employees'), esc(l.employees)],
    [t('l_contact'), esc([l.contact_name, l.contact_role].filter(Boolean).join(', '))], [t('l_channel'), esc(l.contact_channel)],
    [t('l_contactSource'), links(l.contact_source)],
    [t('l_score'), `${esc(l.score)} <span class="muted">(${esc(l.score_why)})</span>`], [t('l_status'), esc(st(l.status))], [t('l_next'), esc([l.next_action, l.next_action_date].filter(Boolean).join(' · '))],
    [t('l_sources'), links(l.sources)]].filter(([, v]) => v);
  let account = '';
  const acc = await fetch(`/api/file?path=${encodeURIComponent(`workspace/prospecting/accounts/${id}.md`)}`);
  if (acc.ok) account = md((await acc.json()).content);
  $('#d-path').textContent = l.company;
  $('#d-body').innerHTML = `<dl class="meta">${fields.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>${account || `<p class="muted">${t('noAccount')}</p>`}`;
  $('#drawer').classList.add('open');
}
function closeDrawer() { $('#drawer').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); closeArtifact(); } });

// ---------- live ----------
function route() { view = (location.hash.slice(1) in VIEWS) ? location.hash.slice(1) : 'office'; render(); }
window.addEventListener('hashchange', route);
function connect() {
  const es = new EventSource('/api/stream');
  es.onopen = () => { $('#live').classList.add('on'); $('#live-t').textContent = t('live'); };
  es.onerror = () => { $('#live').classList.remove('on'); $('#live-t').textContent = t('reconnecting'); };
  es.addEventListener('change', e => load(JSON.parse(e.data).changed || []));
}
// ?live=0 renders a snapshot without the live connection (used for screenshots). ?lang=fr|en forces a language.
const LIVE = new URLSearchParams(location.search).get('live') !== '0';
{ const l = new URLSearchParams(location.search).get('lang'); if (l === 'fr' || l === 'en') LANG = l; }
applyStatic();
$('#live-t').textContent = t('connecting');
load().then(() => { S.events.forEach(e => seen.add(e.ts + e.role + e.text)); route(); if (LIVE) { connect(); chatStream(); } else { $('#live').classList.add('on'); $('#live-t').textContent = t('live'); } });
setInterval(() => { if (view === 'office' && S) render(); }, 30000);

</script>
